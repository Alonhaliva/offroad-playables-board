  #sky{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,190,120,.1),transparent 40%,rgba(25,14,6,.4))}
  #ground{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:2;
    background:linear-gradient(180deg,rgba(50,32,16,0),rgba(40,26,12,.6) 30%,rgba(18,11,5,.92));
    border-top:2px solid rgba(230,200,150,.22)}

  #ttl{position:absolute;top:4%;left:0;right:0;text-align:center;z-index:6;padding:0 3%;
    color:#fff;font-size:clamp(19px,5vw,42px);text-transform:uppercase;white-space:nowrap;
    text-shadow:0 3px 0 var(--red),0 5px 14px rgba(0,0,0,.7)}
  #ttl b{color:var(--amber)}

  /* progress pips */
  #pips{position:absolute;top:15%;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:12px}
  .pip{width:clamp(26px,7vw,40px);height:clamp(26px,7vw,40px);border-radius:50%;
    background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.35);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.6vw,20px);transition:.25s}
  .pip.done{background:var(--green);border-color:#bfe;box-shadow:0 0 14px rgba(110,193,63,.7)}

  #shadow{position:absolute;left:26%;bottom:30%;width:38vmin;height:5vmin;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent);z-index:3;filter:blur(2px)}
  #rig{position:absolute;left:26%;bottom:30%;width:min(52vmin,380px);transform:translateX(-50%);z-index:5;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
  #rig img{width:100%;display:block}
  #rig.jump{animation:jump .62s cubic-bezier(.3,-0.2,.4,1)}
  @keyframes jump{0%{transform:translateX(-50%) translateY(0) rotate(0)}
    40%{transform:translateX(-50%) translateY(-30%) rotate(-9deg)}
    70%{transform:translateX(-50%) translateY(-14%) rotate(4deg)}
    100%{transform:translateX(-50%) translateY(0) rotate(0)}}

  /* obstacle in front of the rig */
  #obs{position:absolute;left:70%;bottom:30%;transform:translateX(-50%);z-index:4;transition:none}
  #obs.pass{animation:pass .6s ease-in forwards}
  @keyframes pass{0%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translate(-360%,10%) scale(.7);opacity:0}}
  .rock{width:clamp(70px,20vw,130px);height:clamp(55px,15vw,100px);
    background:radial-gradient(60% 55% at 40% 35%,#9aa0a6,#4b4f55 70%,#31343a);
    border-radius:46% 54% 48% 52%/60% 58% 42% 40%;box-shadow:inset -8px -8px 16px rgba(0,0,0,.4),0 8px 14px rgba(0,0,0,.5)}
  .mud{width:clamp(90px,26vw,170px);height:clamp(34px,9vw,60px);
    background:radial-gradient(closest-side,#6a4a22,#3a2610);border-radius:50%;
    box-shadow:0 6px 12px rgba(0,0,0,.5),inset 0 6px 10px rgba(0,0,0,.5)}
  .ramp{width:0;height:0;border-style:solid;border-width:0 0 clamp(60px,16vw,110px) clamp(80px,22vw,150px);
    border-color:transparent transparent #6a4a22 transparent;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}

  #dust{position:absolute;left:26%;bottom:30%;width:36vmin;height:20vmin;transform:translateX(-50%);z-index:4;
    background:radial-gradient(closest-side,rgba(230,210,175,.85),transparent);opacity:0;pointer-events:none}
  #dust.puff{animation:puff .6s ease-out}
  @keyframes puff{0%{opacity:0;transform:translateX(-50%) scale(.4)}30%{opacity:.9}100%{opacity:0;transform:translateX(-30%) scale(1.3)}}

  #tapbtn{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:7;border:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:15px 40px;border-radius:999px;
    background:linear-gradient(180deg,#ff5a34,#c62817);color:#fff;
    font-family:"Arial Black",Impact,sans-serif;text-transform:uppercase;
    box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.14),0 0 26px rgba(255,90,52,.5);
    animation:throb 1.05s ease-in-out infinite}
  #tapbtn .big{font-size:clamp(18px,5vw,28px);letter-spacing:.06em}
  #tapbtn .small{font-family:Arial,sans-serif;font-weight:800;font-size:clamp(10px,2.6vw,13px);opacity:.9;letter-spacing:.05em}
  #tapbtn::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid rgba(255,255,255,.5);animation:ripple 1.05s ease-out infinite}
  @keyframes throb{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  @keyframes ripple{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
  #tapbtn.hide{display:none}

  #result{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:2vmin;text-align:center;padding:6%;
    background:radial-gradient(120% 90% at 50% 40%,rgba(6,7,9,.4),rgba(6,7,9,.85))}
  #result.on{display:flex}
  #rtitle{color:#fff;font-size:clamp(24px,7vw,50px);text-transform:uppercase;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.9)}
  #rtitle b{color:var(--green)}
  #rsub{color:var(--amber);font-family:Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    font-size:clamp(12px,3.3vw,18px);text-shadow:0 2px 8px #000}
  #badge{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.15);
    border-radius:11px;padding:5px 13px 5px 5px}
  #badge img{width:38px;height:38px;border-radius:8px}
  #badge span{color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(11px,3vw,15px);line-height:1.1;text-align:left}
  #badge small{display:block;color:#c3b7a7;font-weight:700;font-size:.72em}
  #cta{position:relative;border:0;background:none;cursor:pointer;width:min(64%,300px);animation:pulse 1.4s ease-in-out infinite}
  #cta img{width:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  #cta .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:clamp(16px,4.6vw,26px);letter-spacing:.05em;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

var STORE={iOS:'https://apps.apple.com/us/app/offroad-outlaws/id1286538410',
  Android:'https://play.google.com/store/apps/details?id=com.battlecreek.offroadoutlaws'};
var PLATFORM=/iphone|ipad|ipod/i.test(navigator.userAgent)?'iOS':'Android';
var STAGES=[
  {cls:'rock',big:'Climb!',small:'Tap to clear the rocks'},
  {cls:'mud', big:'Splash!',small:'Tap to blast the mud'},
  {cls:'ramp',big:'Send it!',small:'Tap to hit the jump'}
];
var started=false,viewable=true,busy=false,stage=0;
var obs=document.getElementById('obs'),rig=document.getElementById('rig'),
    dust=document.getElementById('dust'),btn=document.getElementById('tapbtn'),pips=document.querySelectorAll('.pip');

function showStage(){var s=STAGES[stage];obs.className=s.cls;obs.classList.remove('pass');
  document.getElementById('btnbig').textContent=s.big;
  document.getElementById('btnsmall').textContent=s.small;}
function tap(){ if(busy||!started||!viewable||stage>=STAGES.length)return; busy=true;
  rig.classList.add('jump'); obs.classList.add('pass');
  dust.classList.remove('puff');void dust.offsetWidth;dust.classList.add('puff');
  pips[stage].classList.add('done'); pips[stage].textContent='✓';
  setTimeout(function(){ rig.classList.remove('jump'); stage++; busy=false;
    if(stage>=STAGES.length){ finish(); } else { showStage(); }
  },640);
}
function finish(){ btn.classList.add('hide');
  setTimeout(function(){document.getElementById('result').classList.add('on');},250);}
function openStore(){var u=STORE[PLATFORM];
  if(typeof mraid!=='undefined'&&mraid.open){mraid.open(u);}else{window.open(u,'_blank');}}
function wire(){ btn.addEventListener('click',tap);
  document.getElementById('cta').addEventListener('click',function(e){e.stopPropagation();openStore();}); }
function start(){wire();showStage();
  if(typeof mraid==='undefined'){show();return;}
  if(mraid.getState()==='loading'){mraid.addEventListener('ready',onReady);}else{onReady();}}
function onReady(){mraid.addEventListener('viewableChange',onView);if(mraid.isViewable())show();}
function onView(v){viewable=v;if(v)show();}
function show(){if(started)return;started=true;viewable=true;}
document.addEventListener('visibilitychange',function(){viewable=!document.hidden;});
start();
</script>
