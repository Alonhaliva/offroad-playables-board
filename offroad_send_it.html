<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Offroad Outlaws — Send It</title>
<style>
  :root{--red:#e23b2e;--amber:#ffb020;--green:#57c43a;--cyan:#39d7ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a09;touch-action:manipulation;
    font-family:"Arial Black",Impact,system-ui,sans-serif;-webkit-user-select:none;user-select:none}

  /* clean desert gradient so the rig pops */
  #bgfill{position:absolute;inset:0;z-index:0;
    background:linear-gradient(180deg,#8bb0cc 0%,#b7bda8 32%,#d8bd8e 52%,#b58a52 74%,#7a5c33 100%)}
  #scene{position:absolute;inset:0;z-index:1;overflow:hidden;background:transparent}
  #sky{position:absolute;inset:0;background:
    radial-gradient(60% 42% at 50% 46%,rgba(255,244,214,.28),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.06),transparent 44%,rgba(40,26,12,.45))}
  /* defined dirt floor so the rig sits ON the ground */
  /* light scrim only behind the button — keeps the whole rig in the clear */
  #ground{position:absolute;left:0;right:0;bottom:0;height:22%;z-index:2;
    background:linear-gradient(180deg,rgba(12,8,4,0),rgba(12,8,4,.6))}

  #speed{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .15s;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 26px,rgba(255,255,255,.22) 26px 30px);
    -webkit-mask:linear-gradient(90deg,#000,transparent 42%),linear-gradient(270deg,#000,transparent 42%)}
  #scene.launch #speed{opacity:.32;animation:zip .16s linear infinite}
  @keyframes zip{to{background-position:-30px 0}}

  #shadow{position:absolute;left:50%;bottom:38%;width:42vmin;height:5vmin;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(0,0,0,.7),rgba(0,0,0,.28) 55%,transparent);z-index:3;filter:blur(3px)}
  #rig{position:absolute;left:50%;bottom:40%;width:min(62vmin,460px);transform:translateX(-50%);
    z-index:4;filter:drop-shadow(0 0 16px rgba(0,0,0,.55)) drop-shadow(0 12px 16px rgba(0,0,0,.5));transform-origin:60% 92%}
  #rig img{width:100%;display:block}
  #scene.revving #rig{animation:shake .06s linear infinite}
  @keyframes shake{0%{transform:translateX(-50%) rotate(-.7deg)}50%{transform:translateX(-50.7%) rotate(.7deg) translateY(-2px)}100%{transform:translateX(-49.3%) rotate(-.6deg)}}
  #scene.launch #rig{transition:transform .7s cubic-bezier(.45,0,.25,1),opacity .7s ease;
    transform:translateX(-50%) translateY(-125%) scale(.42) rotate(-7deg);opacity:0}

  #burst{position:absolute;left:50%;bottom:34%;width:72vmin;height:42vmin;transform:translateX(-50%);z-index:3;
    background:radial-gradient(closest-side,rgba(230,210,175,.9),rgba(230,210,175,0));opacity:0;pointer-events:none}
  #scene.launch #burst{animation:burst .7s ease-out forwards}
  @keyframes burst{0%{opacity:0;transform:translateX(-50%) scale(.3)}25%{opacity:.95}100%{opacity:0;transform:translateX(-50%) scale(1.7)}}

  #ttl{position:absolute;top:5%;left:0;right:0;text-align:center;z-index:6;padding:0 3%;
    color:#fff;font-size:clamp(20px,5.6vw,48px);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 3px 0 var(--red),0 5px 14px rgba(0,0,0,.7)}
  #ttl b{color:var(--amber)}

  /* the one clear action */
  #go{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);z-index:7;border:0;cursor:pointer;
    display:flex;align-items:center;gap:10px;padding:16px 34px;border-radius:999px;
    background:linear-gradient(180deg,#ff5a34,#c62817);color:#fff;
    font-family:"Arial Black",Impact,sans-serif;font-size:clamp(17px,4.8vw,26px);letter-spacing:.05em;text-transform:uppercase;
    box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.14),0 0 28px rgba(255,90,52,.5);
    animation:throb 1.15s ease-in-out infinite}
  #go .fl{font-size:1.15em;filter:drop-shadow(0 0 6px rgba(255,180,60,.9))}
  #go::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid rgba(255,255,255,.5);
    animation:ripple 1.15s ease-out infinite}
  @keyframes throb{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
  @keyframes ripple{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
  #go.hide{display:none}

  #result{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:2.2vmin;text-align:center;padding:6%;
    background:radial-gradient(120% 90% at 50% 40%,rgba(6,7,9,.35),rgba(6,7,9,.82))}
  #result.on{display:flex}
  #rtitle{color:#fff;font-size:clamp(24px,7.4vw,52px);text-transform:uppercase;line-height:.98;text-shadow:0 3px 14px rgba(0,0,0,.9)}
  #rtitle b{color:var(--cyan)}
  #badge{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.15);
    border-radius:11px;padding:5px 13px 5px 5px}
  #badge img{width:38px;height:38px;border-radius:8px}
  #badge span{color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(11px,3vw,15px);line-height:1.1;text-align:left}
  #badge small{display:block;color:#c3b7a7;font-weight:700;font-size:.72em}
  #cta{position:relative;border:0;background:none;cursor:pointer;width:min(64%,300px);animation:pulse 1.4s ease-in-out infinite}
  #cta img{width:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  #cta .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:clamp(16px,4.6vw,26px);letter-spacing:.05em;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
