<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Offroad Outlaws — Find Your Rig</title>
<style>
  :root{--cyan:#39d7ff;--amber:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a09;touch-action:manipulation;
    font-family:"Arial Black",Impact,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #bg{position:absolute;inset:0;z-index:0;
    background:radial-gradient(130% 100% at 50% 30%,#3a404b 0%,#1d2128 52%,#0a0b0e 100%)}
  #vign{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 100% at 50% 40%,rgba(0,0,0,0),rgba(0,0,0,.72))}

  #ttl{position:absolute;top:6%;left:0;right:0;z-index:6;text-align:center;padding:0 4%;
    color:#fff;font-size:clamp(22px,6vw,48px);text-transform:uppercase;line-height:1;
    text-shadow:0 3px 0 #b8371f,0 5px 14px rgba(0,0,0,.7)}
  #ttl b{color:var(--amber)}
  #q{position:absolute;top:17%;left:0;right:0;z-index:6;text-align:center;padding:0 4%;
    color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(13px,3.6vw,20px);letter-spacing:.04em;
    text-transform:uppercase;text-shadow:0 2px 8px #000}

  /* quiz: big, obvious terrain buttons */
  #quiz{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);z-index:6;
    display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.6vw,18px);
    width:94%;max-width:820px}
  .opt{flex:1 1 240px;min-width:240px;max-width:360px;cursor:pointer;border:0;color:#fff;
    border-radius:18px;padding:20px 16px;text-align:center;position:relative;overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.14);
    transition:transform .15s ease}
  .opt:active{transform:scale(.96)}
  .opt .emo{font-size:clamp(38px,9vw,60px);line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .opt .t{display:block;font-size:clamp(18px,4.6vw,26px);text-transform:uppercase;letter-spacing:.02em;margin-top:8px}
  .opt .d{display:block;font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,2.9vw,14px);opacity:.9;margin-top:4px}
  .opt.rocks {background:linear-gradient(160deg,#8a8f96,#3c4046)}
  .opt.mud   {background:linear-gradient(160deg,#8a6a3c,#4a3418)}
  .opt.dunes {background:linear-gradient(160deg,#e0a94e,#a55f18)}
  .opt::after{content:"TAP";position:absolute;bottom:8px;right:12px;font-family:Arial,sans-serif;font-weight:800;
    font-size:11px;letter-spacing:.12em;opacity:.5}

  /* result */
  #result{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:1.8vmin;text-align:center;padding:6%}
  #result.on{display:flex}
  #rig{width:min(70vmin,440px);max-width:88%;filter:drop-shadow(0 16px 22px rgba(0,0,0,.6));
    animation:pop .5s cubic-bezier(.2,1.5,.45,1) both}
  @keyframes pop{0%{transform:scale(.8) translateY(-16px);opacity:0}100%{transform:none;opacity:1}}
  #rkick{color:#fff;opacity:.85;font-family:Arial,sans-serif;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;font-size:clamp(11px,2.8vw,15px);text-shadow:0 2px 6px #000}
  #rname{color:#fff;font-size:clamp(24px,7vw,48px);text-transform:uppercase;line-height:.98;text-shadow:0 3px 14px rgba(0,0,0,.9)}
  #rname b{color:var(--cyan)}
  #rtag{color:var(--amber);font-family:Arial,sans-serif;font-weight:800;letter-spacing:.03em;
    font-size:clamp(12px,3.2vw,17px);text-transform:uppercase;text-shadow:0 2px 8px #000}
  #badge{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.15);
    border-radius:11px;padding:5px 13px 5px 5px;margin-top:.4vmin}
  #badge img{width:36px;height:36px;border-radius:8px}
  #badge span{color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(11px,2.9vw,15px);line-height:1.1;text-align:left}
  #badge small{display:block;color:#c3b7a7;font-weight:700;font-size:.72em}
  #cta{position:relative;border:0;background:none;cursor:pointer;width:min(62%,300px);animation:pulse 1.4s ease-in-out infinite}
  #cta img{width:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  #cta .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:clamp(16px,4.6vw,26px);letter-spacing:.05em;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  @media (max-aspect-ratio:1/1){
    #quiz{width:92%}
    .opt{flex:1 1 100%;min-width:0;max-width:100%;padding:15px 44px 15px 15px;display:flex;align-items:center;gap:14px;text-align:left}
    .opt .emo{font-size:clamp(34px,11vw,50px);flex:0 0 auto}
    .opt .txt{flex:1;min-width:0;display:flex;flex-direction:column}
    .opt .t{margin-top:0}
    .opt .d{white-space:normal}
    .opt::after{bottom:auto;top:50%;transform:translateY(-50%)} }
</style>

var PLATFORM=/iphone|ipad|ipod/i.test(navigator.userAgent)?'iOS':'Android';
var RES={
  crawler:{img:'assets/crawler.png',name:'F-150 <b>Raptor</b>',tag:'Built to conquer the rocks'},
  pickup: {img:'assets/pickup.png', name:'<b>Silverado</b>',    tag:'Muscle that laughs at mud'},

var started=false,viewable=true,done=false;
function choose(k){var r=RES[k];if(!r||done||!started||!viewable)return;done=true;
  document.getElementById('quiz').style.display='none';
  document.getElementById('q').style.display='none';
  document.getElementById('ttl').style.display='none';

  document.getElementById('result').classList.add('on');}

  for(var i=0;i<o.length;i++)o[i].addEventListener('click',function(){choose(this.getAttribute('data-r'));});
  document.getElementById('cta').addEventListener('click',openStore);}

start();
</script>
