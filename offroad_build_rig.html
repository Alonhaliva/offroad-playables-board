<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Offroad Outlaws — Build Your Rig</title>
<style>
  :root{--cyan:#39d7ff;--amber:#ffb020}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a09;touch-action:manipulation;
    font-family:"Arial Black",Impact,system-ui,sans-serif;-webkit-user-select:none;user-select:none}

  #bg{position:absolute;inset:0;z-index:0;
    background:radial-gradient(130% 100% at 50% 30%,#3a404b 0%,#1d2128 52%,#0a0b0e 100%)}
  #vign{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 100% at 50% 42%,rgba(0,0,0,0),rgba(0,0,0,.7))}

  #ttl{position:absolute;top:4%;left:0;right:0;z-index:6;text-align:center;padding:0 3%;
    color:#fff;font-size:clamp(20px,5.6vw,46px);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 3px 0 #b8371f,0 5px 14px rgba(0,0,0,.7)}
  #ttl b{color:var(--amber)}
  #sub{position:absolute;top:15%;left:0;right:0;z-index:6;text-align:center;
    color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(11px,3vw,16px);letter-spacing:.1em;
    text-transform:uppercase;opacity:.9;text-shadow:0 2px 6px #000;animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}

  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);z-index:3;
    width:min(84vmin,600px);max-width:94%}
  #shadow{position:absolute;left:50%;bottom:-6%;width:74%;height:9%;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(4px)}
  #rig{position:relative;width:100%;aspect-ratio:436/373;display:block;
    background-position:center;background-repeat:no-repeat;background-size:contain;
    filter:drop-shadow(0 14px 20px rgba(0,0,0,.55))}

  /* gloss sweep on repaint */
  #gloss{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:8px}
  #gloss::before{content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
    transform:rotate(18deg);opacity:0}
  #gloss.sweep::before{animation:sweep .55s ease-out}
  @keyframes sweep{0%{left:-60%;opacity:.9}100%{left:120%;opacity:0}}

  #swatches{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);z-index:6;
    display:flex;gap:clamp(8px,2.6vw,16px)}
  .sw{width:clamp(38px,10vw,58px);height:clamp(38px,10vw,58px);border-radius:50%;cursor:pointer;
    border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .15s}
  .sw:active{transform:scale(.9)}
  .sw.sel{transform:scale(1.12);border-color:var(--cyan);box-shadow:0 0 0 3px rgba(57,215,255,.6),0 4px 12px rgba(0,0,0,.5)}

  #cta{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);z-index:7;border:0;background:none;
    cursor:pointer;width:min(60%,290px);display:none;animation:pulse 1.4s ease-in-out infinite}
  #cta.on{display:block}
  #cta img{width:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  #cta .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:clamp(15px,4.4vw,25px);letter-spacing:.05em;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

  #badge{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);z-index:6;display:none;
    align-items:center;gap:9px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.15);
    border-radius:11px;padding:5px 13px 5px 5px}
  #badge.on{display:flex}
  #badge img{width:34px;height:34px;border-radius:8px}
  #badge span{color:#fff;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(11px,2.9vw,14px);line-height:1.1;text-align:left}
  #badge small{display:block;color:#c3b7a7;font-weight:700;font-size:.72em}

  @media (min-aspect-ratio:1/1){
    #stage{width:min(46vmin,420px);top:40%}
    #swatches{bottom:31%}
    .sw{width:clamp(30px,7.5vmin,48px);height:clamp(30px,7.5vmin,48px)}
    #cta{bottom:5%}
    #badge{bottom:auto;top:16%}
  }

var STORE={iOS:'https://apps.apple.com/us/app/offroad-outlaws/id1286538410',
  Android:'https://play.google.com/store/apps/details?id=com.battlecreek.offroadoutlaws'};
var PLATFORM=/iphone|ipad|ipod/i.test(navigator.userAgent)?'iOS':'Android';

/* pre-rendered resprays — real paint jobs (body only; glass/chrome/tires untouched) */
var PAINTS=[
  {chip:'#2a7fe0',cls:'p-blue'},
  {chip:'#e23b2e',cls:'p-red'},
  {chip:'#ff8f1f',cls:'p-orange'},
  {chip:'#39c24a',cls:'p-green'},
  {chip:'#a24be0',cls:'p-purple'}
];
var started=false,viewable=true,painted=false;
var rig=document.getElementById('rig'),gloss=document.getElementById('gloss');

function build(){
  var box=document.getElementById('swatches');
  PAINTS.forEach(function(p,i){
    var s=document.createElement('div');s.className='sw'+(i===0?' sel':'');
    s.style.background=p.chip;s.setAttribute('data-i',i);
    s.addEventListener('click',function(){paint(i,this);});
    box.appendChild(s);
  });
  document.getElementById('cta').addEventListener('click',openStore);
}
function paint(i,el){ if(!started||!viewable)return;
  rig.className=PAINTS[i].cls;
  var sws=document.querySelectorAll('.sw');for(var k=0;k<sws.length;k++)sws[k].classList.remove('sel');
  el.classList.add('sel');
  gloss.classList.remove('sweep');void gloss.offsetWidth;gloss.classList.add('sweep');
  if(!painted){painted=true;document.getElementById('sub').style.display='none';
    document.getElementById('badge').classList.add('on');document.getElementById('cta').classList.add('on');}
}
function openStore(){var u=STORE[PLATFORM];
  if(typeof mraid!=='undefined'&&mraid.open){mraid.open(u);}else{window.open(u,'_blank');}}

function start(){build();
  if(typeof mraid==='undefined'){show();return;}
  if(mraid.getState()==='loading'){mraid.addEventListener('ready',onReady);}else{onReady();}}
function onReady(){mraid.addEventListener('viewableChange',onView);if(mraid.isViewable())show();}
function onView(v){viewable=v;if(v)show();}
function show(){if(started)return;started=true;viewable=true;}
document.addEventListener('visibilitychange',function(){viewable=!document.hidden;});
start();
</script>
